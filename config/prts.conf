# PRTS terminal boot sequence - runtime configuration
# Every value here can be overridden by a user copy at ~/.config/prts/prts.conf
# Layering: defaults in code -> this file -> user file -> environment variables.

[general]
# Master switch. false disables the animation entirely (the login hook also
# honours PRTS_SKIP_BOOT=1).
enabled = true

# Animation pacing, in milliseconds.
char_delay_ms = 10
frame_delay_ms = 30
check_delay_ms = 90
# Total time budget hint. The sequence stretches or compresses slightly to
# respect it; 0 disables the budget.
target_duration_ms = 5200

# When the terminal is narrower than this, the compact layout is used.
min_columns_full = 78
# When the terminal has fewer rows than this, the compact layout is used.
min_rows_full = 30

# Emblem scan sweeps drawn over the logo.
scan_sweeps = 3

[colors]
background = #000000
frame = #11AFCF
frame_dim = #0C5463
primary = #C8D2D6
muted = #67757B
accent = #11AFCF
accent_bright = #8FE9FA
ok = #6FBF9B
warn = #D9A441
error = #B4433C

[identity]
system_name = PRTS
system_full_name = PRIMARY RHODES ISLAND TERMINAL SYSTEM
system_local_name = 原生罗德岛终端服务
operator = seven
