# PRTS terminal boot sequence - runtime configuration
# Every value here can be overridden by a user copy at ~/.config/prts/prts.conf
# Bump [config] schema when the structure or the calibrated defaults change: the
# deploy script replaces stale copies and keeps a backup of the previous file.

[config]
schema = 2

[general]
# Master switch. false disables the animation entirely (the login hook also
# honours PRTS_SKIP_BOOT=1).
enabled = true

# Animation pacing, in milliseconds.
char_delay_ms = 6
frame_delay_ms = 24
check_delay_ms = 70
target_duration_ms = 4200

# Below these sizes the compact layout is used.
min_columns_full = 62
min_rows_full = 27

# Reverse-video frames drawn over the row currently being checked.
flash_frames = 1

[colors]
# Monochrome first: white and grey carry the information.
background = #000000
rule = #333333
primary = #F2F2F2
secondary = #C6C6C6
muted = #8A8A8A
subtle = #5C5C5C
# A single warm gold marks active elements (left bar, corner mark, core diamond).
accent = #D9A441
accent_bright = #F0C674
# Red is reserved for faults.
danger = #D4483B

[identity]
system_name = PRTS
system_full_name = PRIMARY RHODES ISLAND TERMINAL SYSTEM
system_local_name = 原生罗德岛终端服务
system_tag = RHODES ISLAND
access_note = 访问权限已确认
operator = seven
