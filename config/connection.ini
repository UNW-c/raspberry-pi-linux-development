[ssh]
# Preferred name first: mDNS names resolve for both ssh.exe and PowerShell.
host = PRTS.local
fallback_host = PRTS
user = seven
password = 123456
port = 22
connect_timeout = 10

[window]
columns = 120
rows = 38

[project]
remote_path = /home/seven/raspberry-pi-linux-development

[git]
# GitHub is only reachable through the local proxy; gitee uses SSH directly.
github_proxy = http://127.0.0.1:10808
