# PRTS terminal boot sequence - runtime configuration
# Every value here can be overridden by a user copy at ~/.config/prts/prts.conf
# Bump [config] schema when the structure or the calibrated defaults change: the
# deploy script replaces stale copies and keeps a backup of the previous file.

[config]
schema = 3

[general]
# Master switch. false disables the animation entirely (the login hook also
# honours PRTS_SKIP_BOOT=1).
enabled = true

# Animation pacing, in milliseconds.
char_delay_ms = 6
frame_delay_ms = 24
check_delay_ms = 70
target_duration_ms = 4200

# Below these sizes the compact layout is used.
min_columns_full = 62
min_rows_full = 27

# Reverse-video frames drawn over the row currently being checked.
flash_frames = 1

[colors]
# Monochrome terminal: white and grey only. Colour is a state, not decoration.
background = #000000
rule = #2E2E2E
primary = #F0F0F0
secondary = #BFBFBF
muted = #8A8A8A
subtle = #5A5A5A
# Warning and fault states only.
warn = #C9A227
danger = #C0392B

[identity]
system_name = PRTS
system_tag = RHODES ISLAND
operator = seven
